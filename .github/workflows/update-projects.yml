name: Queue Monitor
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes — safer than every 1 min
  workflow_dispatch:         # manual run option

concurrency:
  group: queue-monitor
  cancel-in-progress: false   # don't kill an in-flight run; just skip overlap

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3        # hard stop so a stuck run can't block future ones

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run monitor
        env:
          GRAFANA_USER: ${{ secrets.GRAFANA_USER }}
          GRAFANA_PASS: ${{ secrets.GRAFANA_PASS }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: node queue-monitor.mjs
